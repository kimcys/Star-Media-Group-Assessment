name: Deploy infra

on:
  push:
    branches: [main]
    paths:
      - 'deploy/**'
  pull_request:
    paths:
      - 'deploy/**'

# Least-privilege default: nothing here needs to write to the repo,
# push packages, or comment on anything.
permissions:
  contents: read

jobs:
  build-caddy:
    name: Build & scan Caddy (rate-limit build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - run: docker build -t caddy-ratelimit:${{ github.sha }} deploy/caddy
      - name: Scan image for known-fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: caddy-ratelimit:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Validate the real Caddyfile against this exact build
        run: |
          docker run --rm -v "${{ github.workspace }}/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy-ratelimit:${{ github.sha }} caddy validate --config /etc/caddy/Caddyfile

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          docker tag caddy-ratelimit:${{ github.sha }} ghcr.io/kimcys/caddy-ratelimit:${{ github.sha }}
          docker tag caddy-ratelimit:${{ github.sha }} ghcr.io/kimcys/caddy-ratelimit:latest
          docker push ghcr.io/kimcys/caddy-ratelimit:${{ github.sha }}
          docker push ghcr.io/kimcys/caddy-ratelimit:latest

  deploy:
    name: Deploy Caddy config to production
    runs-on: ubuntu-latest
    needs: [build-caddy]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    permissions:
      contents: read
    steps:
      - name: Pull the new image and reload Caddy with the latest config
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: aimanhakimcy.com
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /root/star-media
            git pull --ff-only origin main
            cd deploy
            docker compose -f docker-compose.production.yml --env-file .env.production pull caddy
            docker compose -f docker-compose.production.yml --env-file .env.production up -d --force-recreate caddy
            docker image prune -f

      - name: Confirm the site is actually up, with the new headers
        run: |
          for i in $(seq 1 10); do
            if curl -fsS -I https://aimanhakimcy.com/ | grep -qi "content-security-policy"; then exit 0; fi
            sleep 3
          done
          echo "Site did not come back with the expected security headers after deploy" >&2
          exit 1
